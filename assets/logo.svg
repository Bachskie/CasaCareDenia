<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120" role="img" aria-label="Casa Care Dénia logo">
  <title>Casa Care Dénia</title>
  <defs>
    <style>
      .brand{font-family: 'Helvetica Neue', Arial, sans-serif; font-weight:600; fill:#0b2b3a}
      .sub{font-family: 'Helvetica Neue', Arial, sans-serif; font-weight:400; fill:#394b56}
    </style>
  </defs>
  <g fill="none" fill-rule="evenodd">
    <g transform="translate(8,8)">
      <!-- house outline -->
      <path d="M28 8 L56 32" stroke="#1B6FA8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M56 32 L56 80" stroke="#1B6FA8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M56 32 L28 56" stroke="#1B6FA8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M28 56 L28 16" stroke="#1B6FA8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M28 16 L56 16" stroke="#1B6FA8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

      <!-- key inside -->
      <g transform="translate(20,42)">
        <circle cx="6" cy="6" r="6" fill="#1B6FA8"/>
        <rect x="12" y="4" width="20" height="4" rx="1.5" fill="#1B6FA8"/>
        <rect x="30" y="6" width="4" height="4" fill="#1B6FA8"/>
      </g>
    </g>

    <!-- Text -->
    <g transform="translate(120,20)">
      <text class="brand" x="0" y="22" font-size="28">Casa <tspan fill="#7fa0d9">Care</tspan></text>
      <text class="sub" x="0" y="52" font-size="14" letter-spacing="6">D É N I A</text>
      <text class="sub" x="0" y="78" font-size="12">Key Holding &amp; Property Management</text>
    </g>
  </g>
</svg>
